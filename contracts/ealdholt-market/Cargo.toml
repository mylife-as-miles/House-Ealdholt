[package]
name = "ealdholt-market"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.30.1", default-features = false }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true

[dev-dependencies]
near-sdk = { version = "=5.30.1", default-features = false, features = ["unit-testing"] }
